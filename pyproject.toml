[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "software-bus"
version = "0.1.0"
description = "A layered software bus for connecting distributed instances over TCP."
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
bl_server = "software_bus.bl_server:main"
bl_client = "software_bus.bl_client:main"
ps_server = "software_bus.ps_server:main"
ps_subscribe = "software_bus.ps_subscribe:main"
ps_publish = "software_bus.ps_publish:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
